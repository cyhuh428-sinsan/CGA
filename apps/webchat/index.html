<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CGA WebChat</title>
  <link rel="stylesheet" href="/apps/webchat/styles.css?v=20260618-1" />
</head>
<body>
  <main class="webchat-shell">
    <section class="webchat-frame">
      <header class="webchat-header">
        <div>
          <strong data-bot-name>CGA WebChat</strong>
          <span data-bot-meta>봇 연결 준비 중</span>
        </div>
        <span class="webchat-status" data-connection-status>연결 준비</span>
      </header>
      <section class="webchat-transcript" data-message-list></section>
      <form class="webchat-compose" data-message-form>
        <input type="text" data-message-input placeholder="메시지를 입력하세요." autocomplete="off" />
        <button type="submit">전송</button>
      </form>
      <div class="webchat-note" data-runtime-note>WebChat 초기화 중입니다.</div>
    </section>
  </main>
  <script type="module" src="/apps/webchat/app.js?v=20260618-1"></script>
</body>
</html>
