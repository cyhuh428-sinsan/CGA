name: cga

services:
  studio:
    container_name: cga-studio
    image: cga-studio
    build:
      context: .
    working_dir: /workspace
    command: npm run studio
    environment:
      PORT: "4173"
      CGA_AUTH_HEADER_FALLBACK: "${CGA_AUTH_HEADER_FALLBACK:-enabled}"
    ports:
      - "4173:4173"
    volumes:
      - .:/workspace
      - cga_node_modules:/workspace/node_modules

volumes:
  cga_node_modules:
