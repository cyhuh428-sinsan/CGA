name: cga

services:
  studio:
    container_name: cga-studio
    image: cga-studio
    restart: unless-stopped
    build:
      context: .
    working_dir: /workspace
    command: npm run studio
    env_file:
      - .env
    environment:
      PORT: "4173"
      CGA_AUTH_HEADER_FALLBACK: "${CGA_AUTH_HEADER_FALLBACK:-disabled}"
      CGA_STORAGE_DRIVER: "${CGA_STORAGE_DRIVER:-postgres}"
      CGA_DB_HOST: "${CGA_DB_HOST:-shared-db}"
      CGA_DB_PORT: "${CGA_DB_PORT:-5432}"
      CGA_DB_NAME: "${CGA_DB_NAME:-cga}"
      CGA_DB_USER: "${CGA_DB_USER:-postgres}"
      CGA_DB_PASSWORD: "${CGA_DB_PASSWORD:-}"
    ports:
      - "4173:4173"
    networks:
      - npm_net
      - pg_net
    volumes:
      - .:/workspace
      - cga_node_modules:/workspace/node_modules

networks:
  npm_net:
    external: true
    name: proxy-network
  pg_net:
    external: true
    name: common_default

volumes:
  cga_node_modules:
